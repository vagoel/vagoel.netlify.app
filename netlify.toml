[build]
  command = "npm --prefix interactive-resume-3d ci && npm --prefix interactive-resume-3d run build"
  publish = "interactive-resume-3d/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
